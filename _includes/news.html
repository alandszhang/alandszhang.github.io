<ul class="news-list">
{% for item in site.data.news limit: 5 %}
  <li><time datetime="{{ item.date }}">{{ item.date }}</time><div>{{ item.text | markdownify }}</div></li>
{% endfor %}
</ul>
<details class="older-news">
  <summary>Earlier news</summary>
  <ul class="news-list">
  {% for item in site.data.news offset: 5 %}
    <li><time datetime="{{ item.date }}">{{ item.date }}</time><div>{{ item.text | markdownify }}</div></li>
  {% endfor %}
  </ul>
</details>
